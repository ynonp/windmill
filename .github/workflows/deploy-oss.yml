name: Deploy AGPL Windmill

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: windmill-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ynonp/windmill' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      IMAGE: ghcr.io/ynonp/windmill-oss
      SLIM_IMAGE: ghcr.io/ynonp/windmill-oss-slim
      EXTRA_IMAGE: ghcr.io/ynonp/windmill-oss-extra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Free disk space for Rust and language runtimes
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish AGPL application
        id: app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            features=oss_core,all_languages,jemalloc
            CARGO_BUILD_JOBS=2
            WM_BUILD_VERSION=oss-${{ github.sha }}
            VITE_SOURCE_URL=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=windmill-oss-app
          cache-to: type=gha,mode=min,scope=windmill-oss-app

      - name: Build and publish our slim base
        id: slim
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/DockerfileSlim
          platforms: linux/amd64
          push: true
          tags: ${{ env.SLIM_IMAGE }}:${{ github.sha }}
          build-args: BASE_IMAGE=${{ env.IMAGE }}@${{ steps.app.outputs.digest }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=windmill-oss-slim
          cache-to: type=gha,mode=min,scope=windmill-oss-slim

      - name: Build and publish extra services on our own base
        id: extra
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/DockerfileExtra
          platforms: linux/amd64
          push: true
          tags: ${{ env.EXTRA_IMAGE }}:${{ github.sha }}
          build-args: BASE_IMAGE=${{ env.SLIM_IMAGE }}@${{ steps.slim.outputs.digest }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=windmill-oss-extra
          cache-to: type=gha,mode=min,scope=windmill-oss-extra

      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.WINDMILL_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WINDMILL_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/windmill-deploy
          chmod 600 ~/.ssh/windmill-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/windmill-deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes root@89.58.35.113 check

      - name: Deploy published image digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          EXTRA_DIGEST: ${{ steps.extra.outputs.digest }}
        run: |
          # A queued build must never roll production back over a newer main push.
          if [[ "$(gh api repos/ynonp/windmill/commits/main --jq .sha)" != "$REVISION" ]]; then
            echo 'A newer commit is on main; skipping this deployment.'
            exit 0
          fi
          printf '%s\n' "$GH_TOKEN" | ssh -i ~/.ssh/windmill-deploy \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            root@89.58.35.113 "deploy $REVISION $APP_DIGEST $EXTRA_DIGEST $ACTOR"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/windmill-deploy
